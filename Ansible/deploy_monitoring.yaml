
---
- name: Deploy Monitoring Stack (Prometheus, Grafana, ELK), Your App & TLS on EKS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: us-east-1
    cluster_name: mohamed-esmael-cluster-v2

    namespace: mohamed-esmael-namespace
    cloudwatch_namespace: amazon-cloudwatch

    es_host: elasticsearch.mohamedesmael.work.gd
    grafana_host: grafana.mohamedesmael.work.gd
    prometheus_host: prometheus.mohamedesmael.work.gd
    app_host: myapp.mohamedesmael.work.gd

    email: mohamed.2714104@gmail.com
    cluster_issuer: letsencrypt-prod

    service_name: mohamed-esmael-service
  
  tasks:

    
    - name: Configure kubeconfig to connect to EKS
      ansible.builtin.shell: >
        aws eks update-kubeconfig --region {{ region }} --name {{ cluster_name }}
      changed_when: false

    - name: Add Helm repositories
      ansible.builtin.shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add elastic https://helm.elastic.co
        helm repo add eks https://aws.github.io/eks-charts
        helm repo update
      changed_when: false

    - name: Install Kubernetes Python client
      ansible.builtin.pip:
        name: kubernetes
        extra_args: --user

  
    - name: Ensure application namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ namespace }}"
        state: present

    - name: Deploy my application to EKS
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ service_name }}"
            namespace: "{{ namespace }}"
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: "{{ service_name }}"
            template:
              metadata:
                labels:
                  app: "{{ service_name }}"
              spec:
                containers:
                  - name: "{{ service_name }}"
                    image: "{{ image_repo }}:{{ image_tag }}"
                    ports:
                      - containerPort: 80
  
    - name: Install Prometheus via Helm
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus-community/prometheus
        release_namespace: "{{ namespace }}"
        create_namespace: false
        wait: true
        timeout: "900s"
        values:
          alertmanager:
            persistence:
              enabled: true
              storageClass: gp3
              size: 2Gi
          server:
            podLabels:                         
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
            persistentVolume:
              enabled: true
              storageClass: gp3
              size: 8Gi

    - name: Install Grafana via Helm
      kubernetes.core.helm:
        name: grafana
        chart_ref: grafana/grafana
        release_namespace: "{{ namespace }}"
        create_namespace: false
        wait: true
        timeout: "900s"
        reuse_values: true           
        values:
          podLabels:                         
            app.kubernetes.io/name: grafana
          adminPassword: "Admin123"
          persistence:
            enabled: true
            storageClassName: gp3
            size: 5Gi

    - name: Create Elasticsearch values file (with static creds)
      ansible.builtin.copy:
        dest: /tmp/elasticsearch-values.yaml
        content: |
          replicas: 3
          minimumMasterNodes: 2
          podLabels:
            app: elasticsearch-master
            component: master
            name: elasticsearch
          volumeClaimTemplate:
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: 10Gi
            storageClassName: gp3
          esJavaOpts: "-Xmx512m -Xms512m"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          security:
            enabled: true
          extraEnvs:
            - name: ELASTIC_USERNAME
              value: elastic           
            - name: ELASTIC_PASSWORD
              value: Admin123   

    - name: Install/Upgrade Elasticsearch via Helm (static user & password)
      kubernetes.core.helm:
        name: elasticsearch
        chart_ref: elastic/elasticsearch
        release_namespace: "{{ namespace }}"
        create_namespace: false
        wait: true
        timeout: "900s"
        reset_values: true     # ← throw away any prior chart values
        force: true            # ← re-create resources if needed
        values_files:
          - /tmp/elasticsearch-values.yaml



    - name: Install cert-manager CRDs and controllers
      kubernetes.core.k8s:
        src: https://github.com/cert-manager/cert-manager/releases/download/v1.15.0/cert-manager.yaml
        state: present
        wait: true
        wait_timeout: "900"          


    - name: Create ClusterIssuer for Let's Encrypt
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          timeout: "900s"
          metadata:
            name: "{{ cluster_issuer }}"
          spec:
            acme:
              email: "{{ email }}"
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: letsencrypt-prod-private-key
              solvers:
                - http01:
                    ingress:
                      class: nginx


    - name: Ingress for Elasticsearch
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: elasticsearch-ingress
            namespace: mohamed-esmael-namespace
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            ingressClassName: nginx 
            tls:
              - hosts:
                  - elasticsearch.mohamedesmael.work.gd
                secretName: elasticsearch-tls
            rules:
              - host: elasticsearch.mohamedesmael.work.gd
                http:
                  paths:       
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: elasticsearch-svc
                          port:
                            number: 9200


    - name: Ingress for kibana
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: kibana-ingress
            namespace: mohamed-esmael-namespace
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            tls:
              - hosts:
                  - kibana.mohamedesmael.work.gd
                secretName: kibana-tls
            rules:
              - host: kibana.mohamedesmael.work.gd
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kibana-svc
                          port:
                            number: 5601

    - name: Ingress for Grafana
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: grafana-ingress
            namespace: mohamed-esmael-namespace
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            ingressClassName: nginx 
            tls:
              - hosts:
                  - grafana.mohamedesmael.work.gd
                secretName: grafana-tls
            rules:
              - host: grafana.mohamedesmael.work.gd
                http:
                  paths:
                    - path: /.well-known/acme-challenge/*
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: grafana-svc
                          port:
                            number: 80
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: grafana-svc
                          port:
                            number: 80


    - name: Ingress for Prometheus
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: prometheus-ingress
            namespace: mohamed-esmael-namespace
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            ingressClassName: nginx 
            tls:
              - hosts:
                  - prometheus.mohamedesmael.work.gd
                secretName: prometheus-tls
            rules:
              - host: prometheus.mohamedesmael.work.gd
                http:
                  paths:
                    - path: /.well-known/acme-challenge/*
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: prometheus-svc
                          port:
                            number: 80
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: prometheus-svc
                          port:
                            number: 80

    - name: Ingress for My App
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: mohamed-esmael-service-ingress
            namespace: mohamed-esmael-namespace
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            ingressClassName: nginx 
            tls:
              - hosts:
                  - myapp.mohamedesmael.work.gd
                secretName: myapp-tls
            rules:
              - host: myapp.mohamedesmael.work.gd
                http:
                  paths:
                    - path: /.well-known/acme-challenge/*
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: myapp-svc
                          port:
                            number: 80
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: myapp-svc
                          port:
                            number: 80

    - name: Delete stale Kibana pre-install hooks
      ansible.builtin.shell: |
        kubectl delete job,serviceaccount,role,rolebinding \
          -l app.kubernetes.io/instance=kibana \
          -n "{{ namespace }}" --ignore-not-found
      changed_when: false

    - name: Ensure static Kibana ES-token Secret exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kibana-kibana-es-token
            namespace: "{{ namespace }}"
          type: Opaque
          stringData:
            token: "Admin123"


    - name: Install/Upgrade Kibana via Helm without hooks
      kubernetes.core.helm:
        name: kibana
        chart_ref: elastic/kibana
        release_namespace: "{{ namespace }}"
        create_namespace: false
        wait: false
        timeout: "900s"
        force: true
        reset_values: true
        disable_hook: true                    
        values:
          elasticsearchHosts: "https://{{ es_host }}/"
          elasticsearchUsername: "elastic"
          elasticsearchPassword: "Admin123"
          elasticsearchSSL:
            verificationMode: none
          logLevel: debug


    - name: Associate IAM OIDC provider with EKS
      ansible.builtin.shell: |
        eksctl utils associate-iam-oidc-provider \
          --region {{ region }} \
          --cluster {{ cluster_name }} \
          --approve
      register: oidc_result
      changed_when: >
        "'has been associated' in oidc_result.stdout or
         'created' in oidc_result.stdout"

    - name: Ensure namespace for CloudWatch exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ cloudwatch_namespace }}"
        state: present

    - name: Install AWS Fluent Bit via Helm
      kubernetes.core.helm:
        name: aws-for-fluent-bit
        chart_ref: eks/aws-for-fluent-bit
        release_namespace: "{{ cloudwatch_namespace }}"
        create_namespace: false
        wait: true
        timeout: "900s"
        values:
          cloudWatch:
            region: "{{ region }}"
            logGroupName: "/aws/eks/{{ cluster_name }}/application"
            logRetentionDays: 30
          clusterName: "{{ cluster_name }}"
          serviceAccount:
            create: true
